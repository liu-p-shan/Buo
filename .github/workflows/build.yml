name: Build Buo APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. 自动修复被浏览器翻译的文件名和文件夹名
      - name: Auto-Fix File Names
        run: |
          if [ -d "自由党" ]; then mv "自由党" "lib"; fi
          find . -name "*.飞镖" -exec bash -c 'mv "$1" "${1%.飞镖}.dart"' _ {} \;
          find . -name "*.dart。" -exec bash -c 'mv "$1" "${1%。}.dart"' _ {} \;

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 2. 核心：自动生成缺失的 android/ios 等原生工程目录
      - name: Generate Missing Flutter Files
        run: flutter create . --project-name safemate

      # 3. 自动修改权限和指纹配置
      - name: Fix Android Configs
        run: |
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' android/app/build.gradle || true
          find android/app/src/main/kotlin -name "MainActivity.kt" -exec sed -i 's/FlutterActivity/FlutterFragmentActivity/g' {} + || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: buo-apk
          path: build/app/outputs/flutter-apk/app-release.apk
