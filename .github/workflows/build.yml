name: Build Buo APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Scaffold android platform (flutter create does NOT touch existing lib/)
        run: flutter create --platforms=android --org com.buo --project-name safemate .

      - name: Apply Buo platform patches
        run: |
          cp patches/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/xml
          cp patches/backup_rules.xml patches/data_extraction_rules.xml android/app/src/main/res/xml/
          mkdir -p android/app/src/main/kotlin/com/buo/safemate
          cp patches/MainActivity.kt android/app/src/main/kotlin/com/buo/safemate/MainActivity.kt
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          cp patches/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          cp patches/ic_launcher_foreground.xml android/app/src/main/res/drawable/ic_launcher_foreground.xml
          cp patches/ic_launcher_background.xml android/app/src/main/res/drawable/ic_launcher_background.xml
          # 关键:整体替换 app 构建配置,彻底关闭 R8 裁剪(防 SQLCipher JNI 断裂)
          cp patches/app_build.gradle.kts android/app/build.gradle.kts
          rm -f android/app/build.gradle
          echo '-keep class net.sqlcipher.** { *; }' >> android/app/proguard-rules.pro
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle 2>/dev/null || true

      - run: flutter pub get

      - name: Tests (non-blocking)
        run: |
          rm -f test/widget_test.dart
          flutter test || echo "::warning::tests failed, build continues"

      - name: Build APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols

      - name: 出厂自检:SQLCipher 类必须存活,否则拒绝出包
        run: |
          rm -rf /tmp/apkchk && mkdir -p /tmp/apkchk
          unzip -o -q build/app/outputs/flutter-apk/app-release.apk "classes*.dex" -d /tmp/apkchk
          if grep -q "net/sqlcipher" /tmp/apkchk/classes*.dex 2>/dev/null; then
            echo "SQLCipher classes OK"
          else
            echo "::error::SQLCipher classes missing from dex (R8 stripped them again!)"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: buo-apk
          path: build/app/outputs/flutter-apk/app-release.apk
